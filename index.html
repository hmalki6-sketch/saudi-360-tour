<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>اكتشف السعودية — تجربة سياحية تفاعلية</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<style>
:root{--bg:#06181b;--panel:rgba(7,28,32,.9);--gold:#d9a85c;--gold2:#f4d49a;--teal:#168a91;--cyan:#65bfd0;--text:#f8fbfb;--muted:#a9c3c6}
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;font-family:Tahoma,Arial,sans-serif;background:var(--bg);color:var(--text);overflow:hidden}
#map{position:fixed;inset:0;z-index:0}.leaflet-tile{filter:brightness(.48) saturate(.55) contrast(1.12)}
.leaflet-control-attribution{background:rgba(0,0,0,.45)!important;color:#bcd0d2!important}.leaflet-control-attribution a{color:var(--gold)!important}
.topbar{position:fixed;z-index:1000;top:18px;right:20px;left:20px;display:flex;justify-content:space-between;align-items:center;pointer-events:none}
.brand,.titlecard,.side{pointer-events:auto}.brand{display:flex;align-items:center;gap:12px;background:rgba(5,25,29,.84);border:1px solid rgba(217,168,92,.35);backdrop-filter:blur(14px);padding:10px 16px;border-radius:18px;box-shadow:0 15px 50px rgba(0,0,0,.3)}
.saudi{width:38px;height:38px;border-radius:12px;display:grid;place-items:center;background:linear-gradient(145deg,#0d684c,#0a3f33);font-size:19px}.brand b{font-size:15px}.brand small{display:block;color:var(--muted);margin-top:2px}
.titlecard{max-width:420px;margin-right:auto;margin-left:22px;background:linear-gradient(135deg,rgba(5,25,29,.94),rgba(7,37,42,.82));border:1px solid rgba(217,168,92,.36);border-radius:24px;padding:20px 22px;box-shadow:0 22px 70px rgba(0,0,0,.38);backdrop-filter:blur(18px)}
.kicker{color:var(--gold2);font-size:11px;letter-spacing:2px;margin-bottom:8px}.titlecard h1{margin:0;font-size:28px}.titlecard p{margin:8px 0 0;color:#c6d9da;line-height:1.7;font-size:13px}
.side{position:fixed;z-index:1000;top:118px;left:20px;width:280px;max-height:calc(100vh - 145px);overflow:auto;padding:12px;border-radius:24px;background:rgba(5,24,28,.82);border:1px solid rgba(101,191,208,.18);backdrop-filter:blur(18px);box-shadow:0 20px 70px rgba(0,0,0,.35)}
.side h2{font-size:15px;margin:4px 8px 12px}.card{padding:13px;margin:8px 0;border-radius:16px;background:linear-gradient(135deg,rgba(255,255,255,.055),rgba(255,255,255,.02));border:1px solid rgba(255,255,255,.07);cursor:pointer;transition:.25s}.card:hover{transform:translateY(-2px);border-color:rgba(217,168,92,.45);background:rgba(217,168,92,.08)}
.card b{font-size:14px}.card span{display:block;color:var(--muted);font-size:11px;margin-top:4px}
.pin{width:22px;height:22px;border-radius:50%;background:radial-gradient(circle,#fff 0 13%,#d9a85c 14% 34%,#168a91 35% 57%,transparent 58%);box-shadow:0 0 0 6px rgba(217,168,92,.1),0 0 25px rgba(101,191,208,.9);animation:pulse 1.8s infinite}
@keyframes pulse{50%{box-shadow:0 0 0 13px rgba(217,168,92,0),0 0 34px rgba(101,191,208,1)}}
.leaflet-marker-icon .label{position:absolute;right:27px;top:-7px;white-space:nowrap;padding:5px 9px;border-radius:9px;background:rgba(5,24,28,.88);border:1px solid rgba(217,168,92,.28);font-size:11px;color:#fff}
.leaflet-popup-content-wrapper,.leaflet-popup-tip{background:#092126;color:#fff;border:1px solid rgba(217,168,92,.3)}.leaflet-popup-content{margin:13px 15px}.pop-title{font-weight:700;margin-bottom:8px}.pop-btn{border:0;background:linear-gradient(135deg,#d9a85c,#f0cf95);color:#13272a;padding:8px 12px;border-radius:10px;font-weight:700;cursor:pointer}
.overlay{position:fixed;inset:0;z-index:3000;background:rgba(0,0,0,.78);display:none;align-items:center;justify-content:center;padding:20px;backdrop-filter:blur(10px)}
.modal{width:min(1050px,96vw);max-height:94vh;background:linear-gradient(145deg,#061a1e,#0a2c31);border:1px solid rgba(217,168,92,.45);border-radius:28px;overflow:hidden;box-shadow:0 35px 120px rgba(0,0,0,.7)}
.modal-head{display:flex;align-items:center;justify-content:space-between;padding:15px 18px;border-bottom:1px solid rgba(255,255,255,.08)}.modal-head h3{margin:0;font-size:18px}.close{width:38px;height:38px;border-radius:50%;border:1px solid rgba(255,255,255,.15);background:rgba(255,255,255,.06);color:white;font-size:22px;cursor:pointer}
.video-wrap{background:#000;aspect-ratio:16/9;display:grid;place-items:center}video{width:100%;height:100%;object-fit:contain;background:#000}
.modal-foot{padding:12px 18px;color:#a9c3c6;font-size:12px;display:flex;justify-content:space-between;gap:12px}.modal-foot a{color:var(--gold2);text-decoration:none}
.hint{position:fixed;z-index:900;bottom:18px;right:20px;background:rgba(5,24,28,.72);border:1px solid rgba(255,255,255,.08);border-radius:13px;padding:8px 12px;color:#bdd0d1;font-size:11px}
@media(max-width:800px){.topbar{top:10px;right:10px;left:10px}.brand{padding:8px 11px}.brand small{display:none}.titlecard{display:none}.side{left:10px;right:10px;top:auto;bottom:10px;width:auto;max-height:30vh;display:flex;gap:8px;overflow-x:auto;overflow-y:hidden;padding:8px}.side h2{display:none}.card{min-width:145px;margin:0}.hint{display:none}.leaflet-control-zoom{display:none}.modal{border-radius:20px}.modal-foot{font-size:10px}}
</style>
</head>
<body>
<div id="map"></div>
<div class="topbar">
<div class="brand"><div class="saudi">🇸🇦</div><div><b>اكتشف السعودية</b><small>رحلة بصرية عبر الوجهات</small></div></div>
<div class="titlecard"><div class="kicker">SAUDI ARABIA · VIRTUAL JOURNEY</div><h1>من الخريطة إلى المشهد</h1><p>اختاري أي وجهة مضيئة على الخريطة لتنتقلي مباشرة إلى المقطع السياحي الخاص بها.</p></div>
</div>
<aside class="side"><h2>الوجهات السياحية</h2><div id="cards"></div></aside>
<div class="hint">اضغطي على أي نقطة مضيئة لبدء الجولة</div>
<div class="overlay" id="overlay" onclick="closeIfOutside(event)">
<div class="modal"><div class="modal-head"><h3 id="modalTitle"></h3><button class="close" onclick="closeTour()">×</button></div>
<div class="video-wrap"><video id="tourVideo" controls playsinline preload="metadata"></video></div>
<div class="modal-foot"><span id="modalMeta"></span><a id="openVideo" href="#" target="_blank" rel="noopener">فتح المقطع</a></div></div></div>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
const places=[
{id:"j",name:"جدة",en:"Jeddah",lat:21.5433,lng:39.1728,video:"videos/j.mp4"},
{id:"r",name:"الرياض",en:"Riyadh",lat:24.7136,lng:46.6753,video:"videos/r.mp4"},
{id:"a",name:"العلا",en:"AlUla",lat:26.608,lng:37.9232,video:"videos/a.mp4"},
{id:"t",name:"تبوك",en:"Tabuk",lat:28.3838,lng:36.555,video:"videos/t.mp4"},
{id:"h",name:"الأحساء",en:"Al Ahsa",lat:25.4297,lng:49.5661,video:"videos/h.mp4"},
{id:"n",name:"نجران",en:"Najran",lat:17.4933,lng:44.1277,video:"videos/n.mp4"},
{id:"s",name:"السودة",en:"As-Soudah",lat:18.264,lng:42.364,video:"videos/s.mp4"},
{id:"f",name:"فيفاء",en:"Fifa",lat:17.263,lng:43.106,video:"videos/f.mp4"}];
const map=L.map('map',{zoomControl:true}).setView([24.1,44.7],5.4);
L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:18,attribution:'© OpenStreetMap contributors'}).addTo(map);
const icon=n=>L.divIcon({className:'',html:`<div class="pin"><span class="label">${n}</span></div>`,iconSize:[22,22],iconAnchor:[11,11]});
const cards=document.getElementById('cards');
places.forEach(p=>{
const m=L.marker([p.lat,p.lng],{icon:icon(p.name)}).addTo(map);
m.bindPopup(`<div class="pop-title">${p.name}</div><button class="pop-btn" onclick="openTour('${p.id}')">شاهد الجولة</button>`);
m.on('click',()=>map.flyTo([p.lat,p.lng],7,{duration:1.2}));
const c=document.createElement('div');c.className='card';c.innerHTML=`<b>${p.name}</b><span>${p.en} · جولة مصوّرة</span>`;
c.onclick=()=>{map.flyTo([p.lat,p.lng],7,{duration:1.2});setTimeout(()=>openTour(p.id),700)};cards.appendChild(c);
});
function openTour(id){const p=places.find(x=>x.id===id);if(!p)return;const o=document.getElementById('overlay'),v=document.getElementById('tourVideo');document.getElementById('modalTitle').textContent=p.name;document.getElementById('modalMeta').textContent=`${p.en} · الفيديو المرفوع للمشروع`;v.pause();v.src=p.video;v.load();document.getElementById('openVideo').href=p.video;o.style.display='flex';document.body.style.overflow='hidden'}
function closeTour(){const o=document.getElementById('overlay'),v=document.getElementById('tourVideo');v.pause();v.removeAttribute('src');v.load();o.style.display='none';document.body.style.overflow=''}
function closeIfOutside(e){if(e.target.id==='overlay')closeTour()}document.addEventListener('keydown',e=>{if(e.key==='Escape')closeTour()});
</script>
</body>
</html>
